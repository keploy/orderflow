version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: orderflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: orderflow-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: orderflow-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    # Probe Kafka with a direct wire-protocol ApiVersions v0 request via the
    # image's stdlib python3 instead of kafka-broker-api-versions, which boots
    # a fresh JVM per check and exceeds its 10 s timeout on CPU-loaded runners
    # even after "[KafkaServer id=1] started".
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import os, socket, struct, sys
          host = os.environ.get("KAFKA_PROBE_HOST", "127.0.0.1")
          port = int(os.environ.get("KAFKA_PROBE_PORT", "9092"))
          cid = 0x4b504c59
          req = struct.pack(">ihhih", 10, 18, 0, cid, -1)
          def rx(sock, n):
              buf = bytearray()
              while len(buf) < n:
                  chunk = sock.recv(n - len(buf))
                  if not chunk:
                      raise EOFError("short read")
                  buf.extend(chunk)
              return bytes(buf)
          with socket.create_connection((host, port), timeout=5) as s:
              s.settimeout(5)
              s.sendall(req)
              size = struct.unpack(">i", rx(s, 4))[0]
              if size < 10 or size > 65536:
                  sys.exit(1)
              body = rx(s, size)
              rcid, err, cnt = struct.unpack(">ihi", body[:10])
              if rcid != cid or err != 0 or cnt <= 0 or size != 10 + 6 * cnt:
                  sys.exit(1)
      interval: 15s
      timeout: 10s
      retries: 10

  # Shard 1 - Orders for users A-M
  postgres_shard1:
    image: postgres:15-alpine
    container_name: orderflow-postgres-shard1
    environment:
      POSTGRES_DB: orders_shard1
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    ports:
      - "5432:5432"
    volumes:
      - shard1_data:/var/lib/postgresql/data
      - ./scripts/init_shard1.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderuser -d orders_shard1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shard 2 - Orders for users N-Z
  postgres_shard2:
    image: postgres:15-alpine
    container_name: orderflow-postgres-shard2
    environment:
      POSTGRES_DB: orders_shard2
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    ports:
      - "5433:5432"
    volumes:
      - shard2_data:/var/lib/postgresql/data
      - ./scripts/init_shard2.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderuser -d orders_shard2"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LocalStack for S3 emulation
  localstack:
    # 4.14.0, not 3.0: 3.0 is 3.0.2 on Debian 12 (glibc 2.36), whose setenv
    # frees the environ array it outgrows while another thread's getenv may
    # still read it. LocalStack adds its AWS credentials to the environment
    # at startup while its analytics thread is in getaddrinfo, and about one
    # start in 2000 dies of SIGSEGV (exit 245). 4.14.0 is Debian 13 (glibc
    # 2.41, which keeps the old array) and starts without an auth token.
    image: localstack/localstack:4.14.0
    container_name: orderflow-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./scripts/init_localstack.sh:/etc/localstack/init/ready.d/init.sh
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Producer API
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: orderflow-producer
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      postgres_shard1:
        condition: service_healthy
      postgres_shard2:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      PG_SHARD1_DSN: postgres://orderuser:orderpass@orderflow-postgres-shard1:5432/orders_shard1?sslmode=disable
      PG_SHARD2_DSN: postgres://orderuser:orderpass@orderflow-postgres-shard2:5432/orders_shard2?sslmode=disable
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: order-receipts
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PORT: "8080"
    restart: on-failure

  # Consumer Service
  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: orderflow-consumer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: order-consumer-group
      KAFKA_TOPIC: orders
    restart: on-failure

volumes:
  shard1_data:
  shard2_data:
  localstack_data:
